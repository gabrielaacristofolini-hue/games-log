<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Games Log</title>
<meta name="description" content="Log pessoal dos meus jogos da PSN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #141416;
    --text: #e8e8e8;
    --soft: #b5b5b5;
    --muted: #7d7d7d;
    --faint: #4a4a4d;
    --line: #232326;
    --serif: "Source Serif 4", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Work Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* Capa do topo: arte larga do jogo mais recente, sumindo no preto */
  .hero { position: relative; height: 420px; overflow: hidden; background: var(--panel); }
  .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(11,11,12,.55) 0%, rgba(11,11,12,0) 30%, rgba(11,11,12,.7) 75%, var(--bg) 100%),
      linear-gradient(to right, rgba(11,11,12,.6) 0%, rgba(11,11,12,0) 45%);
  }
  .hero .brand { position: absolute; top: 18px; left: 0; right: 0; z-index: 1; color: var(--text); }
  .hero .feature { position: absolute; left: 0; right: 0; bottom: 28px; z-index: 1; }
  .hero h1 { margin: 6px 0 4px; font-family: var(--serif); font-size: 44px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.05; }
  .hero .meta { color: var(--soft); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .hero .more { background: none; border: 1px solid rgba(255,255,255,.35); padding: 6px 12px; cursor: pointer; margin-top: 14px; }
  .hero .more:hover { border-color: var(--text); color: var(--text); }

  /* Tags de status */
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px; border: 1px solid var(--text); white-space: nowrap; }
  .tag.done { background: var(--text); color: var(--bg); }
  .tag.playing { color: var(--text); }
  .tag.plat { color: var(--soft); border-color: var(--faint); }
  .tag .icon { width: 11px; height: 11px; }
  .icon { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }

  /* Barra de filtros */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 0 12px; border-bottom: 1px solid var(--line); margin-top: 8px; }
  .status { display: flex; flex-wrap: wrap; gap: 18px; }
  .status button, .views button { background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .status button:hover, .views button:hover { color: var(--text); }
  .status button[aria-pressed="true"], .views button[aria-pressed="true"] { color: var(--text); }
  .status button span { color: var(--faint); margin-left: 3px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  select, input[type=search] {
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 6px 8px; font-size: 13px; color: var(--soft);
  }
  select:focus, input[type=search]:focus { outline: none; border-color: var(--muted); }
  input[type=search] { width: 170px; }
  .views { display: flex; gap: 12px; padding-left: 12px; border-left: 1px solid var(--line); }
  .count { padding: 12px 0 18px; }

  /* Grade */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 28px 18px; align-items: start; }
  .card { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; display: block; width: 100%; }
  .cover { display: block; aspect-ratio: 1; position: relative; overflow: hidden; background: var(--panel); border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center; font-family: var(--serif); font-size: 15px; color: var(--soft); }
  .cover::after { content: ""; position: absolute; inset: 0; border-radius: 3px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s; }
  .card:hover .cover::after, .card:focus-visible .cover::after { box-shadow: inset 0 0 0 2px var(--text); }
  .card:focus-visible { outline: none; }
  .card .name { display: block; font-family: var(--serif); font-size: 16px; font-weight: 600; margin-top: 10px; line-height: 1.25; }
  .card .plat-name { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tags { margin-top: 8px; }

  /* Lista */
  .list { width: 100%; border-collapse: collapse; }
  .list th { text-align: left; padding: 0 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .list td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; color: var(--soft); font-variant-numeric: tabular-nums; }
  .list th:first-child, .list td:first-child { padding-left: 0; }
  .list th:last-child, .list td:last-child { padding-right: 0; text-align: right; }
  .list tbody tr { cursor: pointer; }
  .list tbody tr:hover td { background: var(--panel); }
  .list .game { display: flex; align-items: center; gap: 12px; white-space: normal; color: var(--text); min-width: 180px; }
  .list .cover { width: 40px; flex: none; border-radius: 2px; }
  .list .cover .ph { font-size: 8px; padding: 2px; }
  .list .game b { font-family: var(--serif); font-size: 15px; font-weight: 600; display: block; }
  .list .game small { color: var(--muted); font-size: 12px; }
  .dash { color: var(--faint); }
  .sheet { overflow-x: auto; }

  .none { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Detalhes do jogo */
  dialog {
    width: min(760px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--text); overflow: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  .d-back { height: 220px; position: relative; background: var(--panel); }
  .d-back img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-back::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11,11,12,0) 30%, var(--bg) 100%); }
  .d-body { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 24px; padding: 0 24px 24px; margin-top: -80px; position: relative; z-index: 1; }
  .d-title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 84px 0 4px; line-height: 1.15; }
  .d-sub { color: var(--muted); margin-bottom: 10px; }
  .d-tags { display: flex; gap: 6px; margin-bottom: 16px; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .fact { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .fact:nth-child(odd) { padding-right: 12px; }
  .fact .v { font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .fact .v small { color: var(--muted); font-size: 13px; }
  .close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); cursor: pointer; font-size: 18px; line-height: 1; }

  footer { margin: 56px 0 40px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; }

  @media (max-width: 760px) {
    .hero { height: 300px; }
    .hero h1 { font-size: 30px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; }
    .controls input[type=search] { grid-column: 1 / -1; width: 100%; }
    .views { grid-column: 1 / -1; border-left: 0; padding-left: 0; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
    .list .opt { display: none; }
    .d-body { grid-template-columns: 100px minmax(0, 1fr); gap: 16px; padding: 0 16px 20px; margin-top: -50px; }
    .d-title { font-size: 21px; margin-top: 54px; }
  }
</style>
</head>
<body>
<header class="hero" id="hero"></header>

<div class="wrap">
  <div class="toolbar">
    <div class="status" id="status"></div>
    <div class="controls">
      <select id="year" aria-label="Ano"></select>
      <select id="sort" aria-label="Ordenar por"></select>
      <input type="search" id="search" placeholder="Buscar jogo" aria-label="Buscar jogo">
      <div class="views" id="views"></div>
    </div>
  </div>
  <div class="count label" id="count"></div>

  <main id="games"></main>

  <footer>Dados da API de troféus da PSN. Início = primeiro troféu · Zerado = troféu de fim de história · Platina = troféu de platina.</footer>
</div>

<dialog id="game"></dialog>

<script>
/*
 * ============================================================
 *  DADOS DOS JOGOS — edite aqui para adicionar/atualizar jogos
 * ============================================================
 *  platform:     "PS5", "PS4", ...
 *  startedAt:    data do primeiro troféu (AAAA-MM-DD)
 *  finishedAt:   data do troféu que indica que o jogo foi zerado (AAAA-MM-DD); null = não zerado
 *  finishTrophy: nome do troféu usado para determinar que zerou
 *  platinumAt:   data do troféu de platina (AAAA-MM-DD); null = sem platina
 *  lastPlayedAt: último acesso ao jogo (AAAA-MM-DD)
 *  trophies:     { earned, total, progress (%) }
 *  hours:        horas jogadas (aceita decimal, ex.: 9.15 = 9h09)
 *  genres:       gêneros (opcional)
 *  cover:        URL da capa quadrada, ou lista de URLs tentadas em ordem se uma falhar
 *  backdrop:     URL da arte larga do jogo (usada no topo e nos detalhes)
 *  Imagens salvas dentro do arquivo ficam em ART (no fim do script) e têm prioridade.
 */
const GAMES = [
  {
    title: "Resident Evil 3",
    platform: "PS5",
    startedAt: "2026-03-11",
    finishedAt: "2026-03-15",
    finishTrophy: "Survivor",
    platinumAt: null,
    lastPlayedAt: "2026-05-10",
    trophies: { earned: 21, total: 33, progress: 40 },
    hours: 9.15,
    genres: ["Ação", "Aventura"],
    cover: "https://image.api.playstation.com/vulcan/ap/rnd/202206/0206/WmriZBRlSeXWEEDLJOWW7MdW.png",
    backdrop: "https://image.api.playstation.com/vulcan/ap/rnd/202206/0307/wIVJREWyBg8SyXvXYuBPG6je.png"
  }
];

/* ============================================================ */

const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const STATUS = {
  todos:      { label: "Todos",      test: () => true },
  zerados:    { label: "Zerados",    test: (g) => isDone(g) },
  jogando:    { label: "Jogando",    test: (g) => !isDone(g) },
  platinados: { label: "Platinados", test: (g) => isPlat(g) }
};
const SORTS = {
  recentes: { label: "Jogados recentemente", cmp: (a, b) => desc(a, b, "lastPlayedAt") },
  zerado:   { label: "Data em que zerei",    cmp: (a, b) => desc(a, b, "finishedAt") },
  inicio:   { label: "Data de início",       cmp: (a, b) => desc(a, b, "startedAt") },
  trofeus:  { label: "% de troféus",         cmp: (a, b) => (b.trophies?.progress ?? -1) - (a.trophies?.progress ?? -1) },
  horas:    { label: "Horas jogadas",        cmp: (a, b) => (b.hours ?? -1) - (a.hours ?? -1) },
  nome:     { label: "Nome (A–Z)",           cmp: (a, b) => a.title.localeCompare(b.title) }
};
const VIEWS = { grade: "Grade", lista: "Lista" };

const state = { status: "todos", year: "all", sort: "recentes", view: "grade", query: "" };
try {
  const saved = JSON.parse(localStorage.getItem("gameslog-ui") || "{}");
  if (STATUS[saved.status]) state.status = saved.status;
  if (SORTS[saved.sort]) state.sort = saved.sort;
  if (VIEWS[saved.view]) state.view = saved.view;
  if (saved.year) state.year = saved.year;
} catch (e) {}
const save = () => {
  const { query, ...keep } = state;
  try { localStorage.setItem("gameslog-ui", JSON.stringify(keep)); } catch (e) {}
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isDone = (g) => !!g.finishedAt;
const isPlat = (g) => !!g.platinumAt;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
// Mais recente primeiro; sem data vai pro fim; empate por nome.
const desc = (a, b, key) => (b[key] || "").localeCompare(a[key] || "") || a.title.localeCompare(b.title);
const DASH = `<span class="dash">—</span>`;

function fmtDate(iso) {
  if (!iso) return DASH;
  const [y, m, d] = iso.split("-");
  return `${d} ${MONTHS[m - 1]} ${y}`;
}
function fmtHours(h) {
  const total = Math.round(h * 60);
  return `${Math.floor(total / 60)}h${String(total % 60).padStart(2, "0")}`;
}
function daysBetween(a, b) {
  return a && b ? Math.round((new Date(b) - new Date(a)) / 86400000) : null;
}
// Troca para a próxima imagem da lista quando uma não carrega; sem mais opções, fica o nome do jogo.
function nextImg(img) {
  const [next, ...rest] = JSON.parse(img.dataset.next || "[]");
  if (!next) return img.remove();
  img.dataset.next = JSON.stringify(rest);
  img.src = next;
}
function imgTag(sources, alt = "") {
  const list = sources.filter(Boolean);
  if (!list.length) return "";
  return `<img src="${esc(list[0])}" data-next="${esc(JSON.stringify(list.slice(1)))}" alt="${esc(alt)}" loading="lazy" onerror="nextImg(this)">`;
}
const coverSources = (g) => [ART[g.title]?.cover, ...[].concat(g.cover || [])];
const backdropSources = (g) => [ART[g.title]?.backdrop, g.backdrop];

// Anos em que o jogo teve atividade: do primeiro troféu até o último acesso (ou até zerar).
function yearsOf(g) {
  const from = (g.startedAt || g.finishedAt || g.lastPlayedAt || "").slice(0, 4);
  const to = (g.lastPlayedAt || g.finishedAt || g.startedAt || "").slice(0, 4);
  if (!from) return [];
  const out = [];
  for (let y = Number(from); y <= Number(to || from); y++) out.push(String(y));
  return out;
}
// Em "Zerados" o ano é o ano em que zerei; nos outros, qualquer ano em que joguei.
function inYear(g) {
  if (state.year === "all") return true;
  if (state.status === "zerados") return g.finishedAt?.startsWith(state.year);
  return yearsOf(g).includes(state.year);
}

const ICON = {
  check: `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  play: `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg>`,
  plat: `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2h7v3.5a3.5 3.5 0 0 1-7 0zM4.5 3H2.5v1.2a2.3 2.3 0 0 0 2.2 2.3M11.5 3h2v1.2a2.3 2.3 0 0 1-2.2 2.3M8 9v3M5.5 14h5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`
};
function tags(g) {
  return (isDone(g) ? `<span class="tag done">${ICON.check}Zerado</span>` : `<span class="tag playing">${ICON.play}Jogando</span>`) +
    (isPlat(g) ? `<span class="tag plat">${ICON.plat}Platinado</span>` : "");
}
function cover(g) {
  return `<span class="cover"><span class="ph">${esc(g.title)}</span>${imgTag(coverSources(g), `Capa de ${g.title}`)}</span>`;
}

/* ---------- Topo ---------- */

function renderHero() {
  // Jogo com atividade mais recente que tenha arte larga.
  const g = GAMES.filter((x) => backdropSources(x).some(Boolean)).sort((a, b) => desc(a, b, "lastPlayedAt"))[0];
  const brand = `<div class="wrap brand label">Games Log</div>`;
  if (!g) { $("hero").innerHTML = brand; return; }
  const when = isDone(g) ? `Zerado em ${fmtDate(g.finishedAt)}` : `Último acesso em ${fmtDate(g.lastPlayedAt)}`;
  $("hero").innerHTML = `${imgTag(backdropSources(g))}${brand}
    <div class="wrap feature">
      <div class="label">Jogado recentemente</div>
      <h1>${esc(g.title)}</h1>
      <div class="meta"><span>${esc(g.platform)}</span><span>·</span><span>${when}</span>${tags(g)}</div>
      <button type="button" class="more label" data-game="${esc(g.title)}">Ver detalhes</button>
    </div>`;
}

/* ---------- Filtros ---------- */

function renderControls() {
  $("status").innerHTML = Object.entries(STATUS).map(([k, s]) =>
    `<button type="button" class="label" data-status="${k}" aria-pressed="${state.status === k}">${s.label}<span>${GAMES.filter(s.test).length}</span></button>`).join("");

  const years = [...new Set(GAMES.flatMap((g) => [...yearsOf(g), (g.finishedAt || "").slice(0, 4)]).filter(Boolean))].sort().reverse();
  if (state.year !== "all" && !years.includes(state.year)) state.year = "all";
  $("year").innerHTML = `<option value="all">Todos os anos</option>` +
    years.map((y) => `<option value="${y}"${state.year === y ? " selected" : ""}>${y}</option>`).join("");

  $("sort").innerHTML = Object.entries(SORTS).map(([k, s]) =>
    `<option value="${k}"${state.sort === k ? " selected" : ""}>${s.label}</option>`).join("");

  $("views").innerHTML = Object.entries(VIEWS).map(([k, l]) =>
    `<button type="button" class="label" data-view="${k}" aria-pressed="${state.view === k}">${l}</button>`).join("");
}

/* ---------- Jogos ---------- */

function gridView(list) {
  return `<div class="grid">${list.map((g) => `
    <button type="button" class="card" data-game="${esc(g.title)}">
      ${cover(g)}
      <span class="name">${esc(g.title)}</span>
      <span class="plat-name">${esc(g.platform)}</span>
      <span class="tags">${tags(g)}</span>
    </button>`).join("")}</div>`;
}

function listView(list) {
  const rows = list.map((g) => `
    <tr data-game="${esc(g.title)}">
      <td><div class="game">${cover(g)}<div><b>${esc(g.title)}</b><small>${esc(g.platform)}</small></div></div></td>
      <td><span class="tags">${tags(g)}</span></td>
      <td class="opt">${fmtDate(g.startedAt)}</td>
      <td class="opt">${fmtDate(g.finishedAt)}</td>
      <td class="opt">${isPlat(g) ? "Sim" : `<span class="dash">Não</span>`}</td>
      <td class="opt">${fmtDate(g.platinumAt)}</td>
      <td>${g.trophies ? `${g.trophies.progress}%` : DASH}</td>
      <td class="opt">${g.trophies ? `${g.trophies.earned}/${g.trophies.total}` : DASH}</td>
      <td>${g.hours != null ? fmtHours(g.hours) : DASH}</td>
    </tr>`).join("");
  return `<div class="sheet"><table class="list"><thead><tr>
      <th class="label">Jogo</th><th class="label">Status</th><th class="label opt">Início</th><th class="label opt">Zerado em</th>
      <th class="label opt">Platina</th><th class="label opt">Data da platina</th><th class="label">%</th><th class="label opt">Troféus</th><th class="label">Horas</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderGames() {
  const q = state.query.trim().toLowerCase();
  const list = GAMES
    .filter((g) => STATUS[state.status].test(g) && inYear(g) && (!q || g.title.toLowerCase().includes(q)))
    .sort(SORTS[state.sort].cmp);
  $("count").textContent = plural(list.length, "jogo", "jogos");
  $("games").innerHTML = list.length
    ? (state.view === "lista" ? listView(list) : gridView(list))
    : `<div class="none">Nenhum jogo com esses filtros.</div>`;
}

/* ---------- Detalhes do jogo ---------- */

function openGame(title) {
  const g = GAMES.find((x) => x.title === title);
  if (!g) return;
  const fact = (k, v) => `<div class="fact"><div class="label">${k}</div><div class="v">${v}</div></div>`;
  const days = daysBetween(g.startedAt, g.finishedAt);
  $("game").innerHTML = `
    <button class="close" type="button" aria-label="Fechar">×</button>
    <div class="d-back">${imgTag(backdropSources(g))}</div>
    <div class="d-body">
      <div>${cover(g)}</div>
      <div>
        <h2 class="d-title">${esc(g.title)}</h2>
        <div class="d-sub">${esc([g.platform, ...(g.genres || [])].filter(Boolean).join(" · "))}</div>
        <div class="d-tags">${tags(g)}</div>
        <div class="facts">
          ${fact("Início", fmtDate(g.startedAt))}
          ${fact("Zerado em", fmtDate(g.finishedAt) + (days != null ? ` <small>· ${plural(days, "dia", "dias")}</small>` : ""))}
          ${fact("Platina", isPlat(g) ? fmtDate(g.platinumAt) : "Não")}
          ${fact("Troféu final", esc(g.finishTrophy || "—"))}
          ${fact("Troféus", g.trophies ? `${g.trophies.progress}% <small>· ${g.trophies.earned}/${g.trophies.total}</small>` : "—")}
          ${fact("Horas", g.hours != null ? fmtHours(g.hours) : "—")}
          ${fact("Último acesso", fmtDate(g.lastPlayedAt))}
        </div>
      </div>
    </div>`;
  $("game").showModal();
}

/* ---------- Eventos ---------- */

document.addEventListener("click", (e) => {
  const t = e.target;
  if (t === $("game") || t.closest(".close")) { $("game").close(); return; }
  const s = t.closest("[data-status]");
  if (s) { state.status = s.dataset.status; save(); renderControls(); renderGames(); return; }
  const v = t.closest("[data-view]");
  if (v) { state.view = v.dataset.view; save(); renderControls(); renderGames(); return; }
  const g = t.closest("[data-game]");
  if (g && !g.closest("dialog")) openGame(g.dataset.game);
});
$("year").addEventListener("change", (e) => { state.year = e.target.value; save(); renderGames(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; save(); renderGames(); });
$("search").addEventListener("input", (e) => { state.query = e.target.value; renderGames(); });
