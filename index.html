<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Games Log</title>
<meta name="description" content="Relatório pessoal dos meus jogos da PSN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --text: #f2f2f2;
    --muted: #8c8c8c;
    --faint: #555;
    --grid: #262626;
    --rule: #f2f2f2;
    --head-bg: #0d0d0d;
    --row-hover: #0f0f0f;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 48px 16px 64px; }

  /* Cabeçalho do relatório */
  .report-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px;
    padding-bottom: 14px; border-bottom: 2px solid var(--rule);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .report-meta { margin: 6px 0 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .summary { display: flex; gap: 28px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .summary b { display: block; color: var(--text); font-size: 18px; font-weight: 500; }

  /* Filtro */
  .controls { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--grid); }
  .seg button {
    background: none; border: 0; color: var(--muted); font: inherit; font-family: var(--mono);
    padding: 6px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--grid); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  /* Planilha */
  .sheet { overflow-x: auto; border: 1px solid var(--grid); }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 8px 12px; white-space: nowrap; text-align: left; }
  th:last-child, td:last-child { border-right: 0; }
  thead th {
    background: var(--head-bg); color: var(--muted); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--rule);
  }
  tbody tr:hover td { background: var(--row-hover); }
  td.num, th.num { text-align: right; }
  td.num, td.date, td.idx, tfoot td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.idx, th.idx { width: 1%; color: var(--faint); text-align: right; }
  .empty-cell { color: var(--faint); }

  /* Primeira coluna (jogo) fica fixa ao rolar a planilha para o lado */
  .col-game { position: sticky; left: 0; background: var(--bg); z-index: 1; }
  thead .col-game { background: var(--head-bg); }
  tbody tr:hover .col-game { background: var(--row-hover); }
  .game { display: flex; align-items: center; gap: 10px; }
  .thumb { flex: none; width: 32px; height: 32px; position: relative; background: #1a1a1a; display: grid; place-items: center; overflow: hidden; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb span { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .game .name { font-weight: 500; }

  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border: 1px solid var(--text); vertical-align: 1px; }
  .status.done::before { background: var(--text); }
  .status.playing { color: var(--muted); }
  .status.playing::before { border-color: var(--muted); }

  tfoot td { border-top: 2px solid var(--rule); border-bottom: 0; font-weight: 500; background: var(--head-bg); }
  tfoot .col-game { background: var(--head-bg); font-family: "IBM Plex Sans", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); }

  .empty { padding: 40px 12px; text-align: center; color: var(--muted); }

  footer { margin-top: 20px; color: var(--faint); font-size: 11px; font-family: var(--mono); line-height: 1.7; }

  @media (max-width: 560px) {
    .wrap { padding-top: 32px; }
    .summary { gap: 20px; }
    .summary b { font-size: 16px; }
    th, td { padding: 7px 10px; }
    .idx { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="report-head">
    <div>
      <h1>Games Log</h1>
      <p class="report-meta" id="meta"></p>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <div class="controls">
    <span>Mostrar</span>
    <div class="seg" id="filter" role="group" aria-label="Filtro"></div>
  </div>

  <div class="sheet" id="sheet"></div>

  <footer>
    Fonte: API de troféus da PSN.<br>
    Início = primeiro troféu · Zerado em = troféu de fim de história · Platina em = troféu de platina.
  </footer>
</div>

<script>
/*
 * ============================================================
 *  DADOS DOS JOGOS — edite aqui para adicionar/atualizar jogos
 * ============================================================
 *  platform:     "PS5", "PS4", ...
 *  startedAt:    data do primeiro troféu (AAAA-MM-DD)
 *  finishedAt:   data do troféu que indica que o jogo foi zerado (AAAA-MM-DD); null = não zerado
 *  finishTrophy: nome do troféu usado para determinar que zerou
 *  platinumAt:   data do troféu de platina (AAAA-MM-DD); null = sem platina
 *  lastPlayedAt: último acesso ao jogo (AAAA-MM-DD)
 *  trophies:     { earned, total, progress (%) }
 *  hours:        horas jogadas (aceita decimal, ex.: 9.15 = 9h09)
 *  cover:        URL da capa, ou lista de URLs tentadas em ordem se uma falhar (opcional).
 *                Se o jogo tiver capa salva em COVERS (no fim do script), ela é usada primeiro.
 */
const UPDATED_AT = "2026-10-22";
const PSN_USER = "gabcrstn";

const GAMES = [
  {
    title: "Resident Evil 3",
    platform: "PS5",
    startedAt: "2026-03-11",
    finishedAt: "2026-03-15",
    finishTrophy: "Survivor",
    platinumAt: null,
    lastPlayedAt: "2026-05-10",
    trophies: { earned: 21, total: 33, progress: 40 },
    hours: 9.15,
    cover: [
      "https://image.api.playstation.com/vulcan/ap/rnd/202206/0206/WmriZBRlSeXWEEDLJOWW7MdW.png",
      "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/952060/header.jpg"
    ]
  }
];

/* ============================================================ */

const FILTERS = { todos: "Todos", zerados: "Zerados" };
const state = { filter: "todos" };
try {
  const saved = JSON.parse(localStorage.getItem("gameslog-ui") || "{}");
  if (saved.filter && FILTERS[saved.filter]) state.filter = saved.filter;
} catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isDone = (g) => !!g.finishedAt;
const isPlat = (g) => !!g.platinumAt;
const EMPTY = `<span class="empty-cell">—</span>`;

function fmtDate(iso) {
  if (!iso) return EMPTY;
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtHours(h) {
  const total = Math.round(h * 60);
  return `${Math.floor(total / 60)}h${String(total % 60).padStart(2, "0")}`;
}
function initials(title) {
  return title.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w[0])).slice(0, 3).map((w) => w[0]).join("").toUpperCase();
}
// Troca para a próxima capa da lista quando uma não carrega; sem mais opções, ficam as iniciais.
function nextCover(img) {
  const [next, ...rest] = JSON.parse(img.dataset.next || "[]");
  if (!next) return img.remove();
  img.dataset.next = JSON.stringify(rest);
  img.src = next;
}

/* ---------- Colunas ---------- */

function gameCell(g) {
  const covers = [COVERS[g.title], ...[].concat(g.cover || [])].filter(Boolean);
  const img = covers.length
    ? `<img src="${esc(covers[0])}" data-next="${esc(JSON.stringify(covers.slice(1)))}" alt="" loading="lazy" onerror="nextCover(this)">`
    : "";
  return `<div class="game"><div class="thumb"><span>${esc(initials(g.title))}</span>${img}</div><span class="name">${esc(g.title)}</span></div>`;
}

// cls: classe da célula · total: valor da linha de totais (recebe a lista exibida)
const COLUMNS = [
  { label: "Jogo",       cls: "col-game", cell: gameCell,
    total: (l) => `Total · ${l.length} jogo${l.length === 1 ? "" : "s"}` },
  { label: "Plataforma", cell: (g) => esc(g.platform || "—") },
  { label: "Status",
    cell: (g) => (isDone(g) ? `<span class="status done">Zerado</span>` : `<span class="status playing">Jogando</span>`),
    total: (l) => `${l.filter(isDone).length} zerado${l.filter(isDone).length === 1 ? "" : "s"}` },
  { label: "Platinado",
    cell: (g) => (isPlat(g) ? "<b>Sim</b>" : `<span class="empty-cell">Não</span>`),
    total: (l) => `${l.filter(isPlat).length}` },
  { label: "Início",     cls: "date", cell: (g) => fmtDate(g.startedAt) },
  { label: "Zerado em",  cls: "date", cell: (g) => fmtDate(g.finishedAt) },
  { label: "Platina em", cls: "date", cell: (g) => fmtDate(g.platinumAt) },
  { label: "%",          cls: "num",  cell: (g) => (g.trophies ? `${g.trophies.progress}%` : EMPTY),
    total: (l) => {
      const t = l.filter((g) => g.trophies);
      return t.length ? `${Math.round(t.reduce((s, g) => s + g.trophies.progress, 0) / t.length)}% méd.` : "";
    } },
  { label: "Troféus",    cls: "num",  cell: (g) => (g.trophies ? `${g.trophies.earned}/${g.trophies.total}` : EMPTY),
    total: (l) => {
      const t = l.filter((g) => g.trophies);
      return t.length ? `${t.reduce((s, g) => s + g.trophies.earned, 0)}/${t.reduce((s, g) => s + g.trophies.total, 0)}` : "";
    } },
  { label: "Horas",      cls: "num",  cell: (g) => (g.hours != null ? fmtHours(g.hours) : EMPTY),
    total: (l) => fmtHours(l.reduce((s, g) => s + (g.hours || 0), 0)) }
];

/* ---------- Tela ---------- */

function renderHeader() {
  const done = GAMES.filter(isDone).length;
  const hours = GAMES.reduce((s, g) => s + (g.hours || 0), 0);
  $("meta").textContent = `Relatório de jogos · PSN ${PSN_USER} · atualizado em ${fmtDate(UPDATED_AT)}`;
  $("summary").innerHTML = [
    ["Jogos", GAMES.length],
    ["Zerados", done],
    ["Platinas", GAMES.filter(isPlat).length],
    ["Horas", fmtHours(hours)]
  ].map(([l, v]) => `<div><b>${v}</b>${l}</div>`).join("");
}

function renderFilter() {
  const counts = { todos: GAMES.length, zerados: GAMES.filter(isDone).length };
  $("filter").innerHTML = Object.entries(FILTERS).map(([k, label]) =>
    `<button type="button" data-filter="${k}" aria-pressed="${state.filter === k}">${label} (${counts[k]})</button>`
  ).join("");
  $("filter").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    state.filter = b.dataset.filter;
    try { localStorage.setItem("gameslog-ui", JSON.stringify({ filter: state.filter })); } catch (e) {}
    render();
  }));
}

function renderSheet() {
  // Zerados: do mais recente para o mais antigo pela data em que zerou; Todos: pela data de início.
  const key = state.filter === "zerados" ? "finishedAt" : "startedAt";
  const list = GAMES.filter((g) => state.filter === "todos" || isDone(g))
    .sort((a, b) => (b[key] || "").localeCompare(a[key] || "") || a.title.localeCompare(b.title));

  const td = (c, html) => `<td${c.cls ? ` class="${c.cls}"` : ""}>${html}</td>`;
  const head = `<th class="idx">#</th>` + COLUMNS.map((c) => `<th${c.cls ? ` class="${c.cls}"` : ""}>${c.label}</th>`).join("");
  const body = list.length
    ? list.map((g, i) => `<tr><td class="idx">${i + 1}</td>${COLUMNS.map((c) => td(c, c.cell(g))).join("")}</tr>`).join("")
    : `<tr><td class="empty" colspan="${COLUMNS.length + 1}">Nenhum jogo zerado ainda.</td></tr>`;
  const foot = list.length
    ? `<tfoot><tr><td class="idx"></td>${COLUMNS.map((c) => td(c, c.total ? c.total(list) : "")).join("")}</tr></tfoot>`
    : "";
  $("sheet").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table>`;
}

/*
 * Capas salvas dentro do próprio arquivo (miniaturas 128x128 em base64), pelo título do jogo.
 * Assim a capa aparece mesmo quando os sites de imagem estão fora do ar ou bloqueados.
 */
