<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games Log</title>
<meta name="description" content="Log pessoal dos jogos que eu zerei, estou jogando e quero jogar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --text: #1c1917;
    --muted: #78716c;
    --faint: #a8a29e;
    --line: #e7e5e4;
    --field: #ffffff;
    --thumb-l: 90%;
    --thumb-text: rgba(28, 25, 23, .55);
    --done: #16a34a;
    --playing: #d97706;
    --played: #7c3aed;
    --wish: #0284c7;
    --star: #1c1917;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --text: #ececec;
      --muted: #8e8e93;
      --faint: #5c5c61;
      --line: #232326;
      --field: #17171a;
      --thumb-l: 20%;
      --thumb-text: rgba(255, 255, 255, .6);
      --done: #4ade80;
      --playing: #fbbf24;
      --played: #a78bfa;
      --wish: #38bdf8;
      --star: #ececec;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }

  header { margin-bottom: 40px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle { margin: 4px 0 0; color: var(--muted); }

  .stats { display: flex; flex-wrap: wrap; gap: 20px 40px; padding: 0 0 32px; margin-bottom: 32px; border-bottom: 1px solid var(--line); }
  .stat .value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .stat .label { color: var(--muted); font-size: 13px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .tab {
    border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500;
    padding: 6px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab .count { color: var(--faint); margin-left: 4px; font-weight: 400; }
  .filters { display: flex; gap: 8px; }
  select, input[type=search] {
    background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 14px;
  }
  select:focus, input[type=search]:focus { outline: none; border-color: var(--muted); }
  input[type=search] { width: 180px; }

  .year-group { margin-top: 32px; }
  .year-group h2 { font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 4px; }

  .game {
    display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 18px; align-items: start;
    padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .thumb {
    grid-row: span 2; width: 64px; height: 64px; border-radius: 10px; overflow: hidden;
    display: grid; place-items: center; background: hsl(var(--h) 30% var(--thumb-l)); position: relative;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span { font-size: 18px; font-weight: 700; color: var(--thumb-text); letter-spacing: -0.02em; }

  .title { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.zerado { color: var(--done); }
  .status.jogando { color: var(--playing); }
  .status.jogado { color: var(--played); }
  .status.quero { color: var(--wish); }

  .details { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 500; }
  .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); max-width: 320px; }
  .bar { flex: 1; height: 3px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--text); }
  .note { font-size: 13px; color: var(--muted); }

  .side { text-align: right; display: flex; flex-direction: column; align-items: end; gap: 4px; }
  .stars { color: var(--star); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  .stars .off { color: var(--line); }
  .stars.none { color: var(--faint); letter-spacing: 0; }
  .side a { color: var(--muted); font-size: 13px; text-decoration: none; }
  .side a:hover { color: var(--text); }

  .empty { color: var(--muted); padding: 48px 0; text-align: center; }

  footer { margin-top: 56px; color: var(--faint); font-size: 12px; }

  @media (max-width: 560px) {
    .wrap { padding-top: 40px; }
    .stats { gap: 16px 28px; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .filters > * { flex: 1 1 0; min-width: 0; width: 0; }
    .game { grid-template-columns: 48px 1fr; column-gap: 14px; }
    .thumb { width: 48px; height: 48px; grid-row: span 1; }
    .thumb span { font-size: 14px; }
    .side { grid-column: 2; grid-row: 2; flex-direction: row; align-items: center; gap: 14px; text-align: left; }
    .details { grid-column: 2; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Games Log</h1>
    <p class="subtitle">O que eu zerei, o que estou jogando e o que quero jogar.</p>
  </header>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <nav class="tabs" id="tabs"></nav>
    <div class="filters">
      <select id="yearFilter" aria-label="Filtrar por ano"></select>
      <input type="search" id="search" placeholder="Buscar jogo" aria-label="Buscar jogo">
    </div>
  </div>

  <main id="list"></main>

  <footer>Datas de conclusão baseadas no troféu de fim de jogo da PSN. Notas são minhas, não da comunidade.</footer>
</div>

<script>
/*
 * ============================================================
 *  DADOS DOS JOGOS — edite aqui para adicionar/atualizar jogos
 * ============================================================
 *  status:       "zerado" | "jogando" | "jogado" (joguei mas não zerei) | "quero"
 *  platform:     "PS5", "PS4", ...
 *  rating:       minha nota de 0 a 5 (null = sem nota)
 *  startedAt:    data do primeiro troféu (AAAA-MM-DD)
 *  finishedAt:   data do troféu que indica que o jogo foi zerado (AAAA-MM-DD)
 *  finishTrophy: nome do troféu usado para determinar que zerou
 *  trophies:     { earned, total, progress (%), platinum (true/false) }
 *  hours:        horas jogadas (se disponível; aceita decimal, ex.: 9.15 = 9h09)
 *  cover:        URL da capa, ou lista de URLs tentadas em ordem se uma falhar (opcional).
 *                Se o jogo tiver capa salva em COVERS (no fim do script), ela é usada primeiro.
 *  psnUrl:       link da página do jogo no perfil da PSN
 */
const GAMES = [
  {
    title: "Resident Evil 3",
    platform: "PS5",
    status: "zerado",
    rating: 3,
    startedAt: "2026-03-11",
    finishedAt: "2026-03-15",
    finishTrophy: "Survivor",
    trophies: { earned: 21, total: 33, progress: 40, platinum: false },
    hours: 9.15,
    cover: [
      "https://image.api.playstation.com/vulcan/ap/rnd/202206/0206/WmriZBRlSeXWEEDLJOWW7MdW.png",
      "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/952060/header.jpg"
    ],
    psnUrl: "https://psnprofiles.com/trophies/16678-resident-evil-3/gabcrstn",
    notes: "Zerado no Hardcore (troféu Veteran junto com o Survivor)."
  }
];

/* ============================================================ */

const STATUS = {
  zerado:  { label: "Zerados",     badge: "Zerado" },
  jogando: { label: "Jogando",     badge: "Jogando" },
  jogado:  { label: "Já joguei",   badge: "Joguei" },
  quero:   { label: "Quero jogar", badge: "Quero jogar" }
};
const TAB_ORDER = ["zerado", "jogando", "jogado", "quero"];
const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

const state = { tab: "zerado", year: "all", query: "" };
try {
  const saved = JSON.parse(localStorage.getItem("gameslog-ui") || "{}");
  if (saved.tab && STATUS[saved.tab]) state.tab = saved.tab;
} catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtDate(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  return `${String(d).padStart(2, "0")} ${MONTHS[m - 1]} ${y}`;
}
function yearOf(g) {
  const d = g.finishedAt || g.startedAt;
  return d ? d.slice(0, 4) : null;
}
function daysBetween(a, b) {
  if (!a || !b) return null;
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function initials(title) {
  return title.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w[0])).slice(0, 3).map((w) => w[0]).join("").toUpperCase();
}
function hue(title) {
  let h = 0;
  for (const c of title) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
// Troca para a próxima capa da lista quando uma não carrega; sem mais opções, ficam as iniciais.
function nextCover(img) {
  const [next, ...rest] = JSON.parse(img.dataset.next || "[]");
  if (!next) return img.remove();
  img.dataset.next = JSON.stringify(rest);
  img.src = next;
}
function fmtHours(h) {
  const total = Math.round(h * 60);
  const m = total % 60;
  return m ? `${Math.floor(total / 60)}h${String(m).padStart(2, "0")}` : `${total / 60}h`;
}
function stars(rating) {
  if (rating == null) return `<div class="stars none">sem nota</div>`;
  let out = "";
  for (let i = 1; i <= 5; i++) out += i <= Math.round(rating) ? "★" : `<span class="off">★</span>`;
  return `<div class="stars" aria-label="Nota ${rating} de 5" title="${rating}/5">${out}</div>`;
}

function renderStats() {
  const done = GAMES.filter((g) => g.status === "zerado");
  const thisYear = String(new Date().getFullYear());
  const doneThisYear = done.filter((g) => g.finishedAt && g.finishedAt.startsWith(thisYear)).length;
  const rated = GAMES.filter((g) => g.rating != null);
  const avg = rated.length ? (rated.reduce((s, g) => s + g.rating, 0) / rated.length).toFixed(1) : "—";
  const plats = GAMES.filter((g) => g.trophies && g.trophies.platinum).length;
  const hours = GAMES.reduce((s, g) => s + (g.hours || 0), 0);
  const items = [
    ["Zerados", done.length],
    [`Em ${thisYear}`, doneThisYear],
    ["Jogando", GAMES.filter((g) => g.status === "jogando").length],
    ["Platinas", plats],
    ["Nota média", avg],
    ["Horas", hours ? fmtHours(hours) : "—"]
  ];
  $("stats").innerHTML = items.map(([l, v]) => `<div class="stat"><div class="value">${v}</div><div class="label">${l}</div></div>`).join("");
}

function renderTabs() {
  $("tabs").innerHTML = TAB_ORDER.map((k) => {
    const n = GAMES.filter((g) => g.status === k).length;
    return `<button class="tab ${state.tab === k ? "active" : ""}" data-tab="${k}">${STATUS[k].label}<span class="count">${n}</span></button>`;
  }).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
    state.tab = b.dataset.tab;
    state.year = "all";
    try { localStorage.setItem("gameslog-ui", JSON.stringify({ tab: state.tab })); } catch (e) {}
    render();
  }));
}

function renderYearFilter(games) {
  const years = [...new Set(games.map(yearOf).filter(Boolean))].sort().reverse();
  $("yearFilter").innerHTML = `<option value="all">Todos os anos</option>` +
    years.map((y) => `<option value="${y}" ${state.year === y ? "selected" : ""}>${y}</option>`).join("");
}

function row(g) {
  // As iniciais ficam por baixo da capa e aparecem se a imagem não carregar.
  const covers = [COVERS[g.title], ...[].concat(g.cover || [])].filter(Boolean);
  const thumb = `<span>${esc(initials(g.title))}</span>` + (covers.length
    ? `<img src="${esc(covers[0])}" data-next="${esc(JSON.stringify(covers.slice(1)))}" alt="Capa de ${esc(g.title)}" loading="lazy" onerror="nextCover(this)">`
    : "");
  const t = g.trophies;
  const days = daysBetween(g.startedAt, g.finishedAt);

  // Só mostra o que já foi preenchido, para manter a linha enxuta.
  const meta = [];
  if (g.status === "zerado" && g.finishedAt) meta.push(["Zerado em", fmtDate(g.finishedAt)]);
  if (g.startedAt) meta.push(["Começou em", fmtDate(g.startedAt)]);
  if (g.status === "zerado" && days != null) meta.push(["Levou", `${days} dia${days === 1 ? "" : "s"}`]);
  if (g.hours != null) meta.push(["Horas", fmtHours(g.hours)]);
  if (t) meta.push(["Troféus", `${t.earned}/${t.total}${t.platinum ? " · Platina" : ""}`]);
  if (g.finishTrophy) meta.push(["Troféu final", esc(g.finishTrophy)]);

  const details = [
    meta.length ? `<div class="meta">${meta.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("")}</div>` : "",
    t && t.progress != null ? `<div class="progress"><div class="bar"><span style="width:${t.progress}%"></span></div>${t.progress}%</div>` : "",
    g.notes ? `<div class="note">${esc(g.notes)}</div>` : ""
  ].join("");

  return `
  <article class="game">
    <div class="thumb" style="--h: ${hue(g.title)}">${thumb}</div>
    <div>
      <h3 class="title">${esc(g.title)}</h3>
      <div class="sub">
        <span class="status ${g.status}">${STATUS[g.status].badge}</span>
        ${g.platform ? `<span>${esc(g.platform)}</span>` : ""}
      </div>
    </div>
    <div class="side">
      ${stars(g.rating)}
      ${g.psnUrl ? `<a href="${esc(g.psnUrl)}" target="_blank" rel="noopener">Troféus ↗</a>` : ""}
    </div>
    ${details ? `<div class="details">${details}</div>` : ""}
  </article>`;
}

function sortGames(list) {
  // Mais recentes primeiro: data de conclusão, depois início; sem data vai pro fim.
  return list.slice().sort((a, b) => {
    const da = a.finishedAt || a.startedAt || "";
    const db = b.finishedAt || b.startedAt || "";
    if (da === db) return a.title.localeCompare(b.title);
    if (!da) return 1;
    if (!db) return -1;
    return db.localeCompare(da);
  });
}

function renderList() {
  const inTab = GAMES.filter((g) => g.status === state.tab);
  renderYearFilter(inTab);
  const q = state.query.trim().toLowerCase();
  let list = inTab.filter((g) => (state.year === "all" || yearOf(g) === state.year) && (!q || g.title.toLowerCase().includes(q)));
  list = sortGames(list);

  if (!list.length) {
    const msg = inTab.length ? "Nenhum jogo encontrado com esses filtros." : `Nenhum jogo em "${STATUS[state.tab].label}" ainda.`;
    $("list").innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  // Agrupa por ano para a linha do tempo dos "últimos tempos".
  const groups = new Map();
  for (const g of list) {
    const y = yearOf(g) || "Sem data";
    if (!groups.has(y)) groups.set(y, []);
    groups.get(y).push(g);
  }
  $("list").innerHTML = [...groups].map(([y, gs]) =>
    `<section class="year-group"><h2>${y}</h2>${gs.map(row).join("")}</section>`
  ).join("");
}

/*
 * Capas salvas dentro do próprio arquivo (miniaturas 128x128 em base64), pelo título do jogo.
 * Assim a capa aparece mesmo quando os sites de imagem estão fora do ar ou bloqueados.
 */
