<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Games Log</title>
<meta name="description" content="Diário pessoal dos meus jogos da PSN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #141416;
    --text: #e8e8e8;
    --soft: #b5b5b5;
    --muted: #7d7d7d;
    --faint: #4a4a4d;
    --line: #232326;
    --serif: "Source Serif 4", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Work Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
  .label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* Backdrop: arte larga do jogo mais recente, sumindo no preto */
  .backdrop { position: relative; height: 380px; overflow: hidden; background: var(--panel); }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; filter: grayscale(.15); }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(11,11,12,.15) 0%, rgba(11,11,12,0) 35%, rgba(11,11,12,.85) 85%, var(--bg) 100%),
      linear-gradient(to right, var(--bg) 0%, rgba(11,11,12,0) 18%, rgba(11,11,12,0) 82%, var(--bg) 100%);
  }
  .backdrop .caption { position: absolute; right: 16px; top: 14px; z-index: 1; font-size: 11px; color: var(--muted); }

  /* Perfil */
  .profile { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; margin-top: -64px; position: relative; z-index: 1; }
  .who { display: flex; align-items: center; gap: 16px; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    background: var(--text); color: var(--bg); font-family: var(--serif); font-size: 32px; font-weight: 600;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .who h1 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .who .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .counters { display: flex; }
  .counter { text-align: center; padding: 0 18px; border-left: 1px solid var(--line); }
  .counter:first-child { border-left: 0; }
  .counter .label { white-space: nowrap; }
  .counter b { display: block; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Navegação */
  nav.sections { display: flex; justify-content: center; gap: 32px; margin: 28px 0 32px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  nav.sections button {
    background: none; border: 0; padding: 12px 0; cursor: pointer; color: var(--muted);
    font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid transparent; margin-bottom: -1px;
  }
  nav.sections button:hover { color: var(--text); }
  nav.sections button[aria-current="true"] { color: var(--text); border-bottom-color: var(--text); }

  /* Títulos de seção */
  .section { margin-bottom: 40px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 14px; }
  .section-head button { background: none; border: 0; cursor: pointer; padding: 0; }
  .section-head button:hover { color: var(--text); }
  .none { color: var(--muted); font-size: 13px; padding: 8px 0; }

  .profile-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 40px; }
  aside .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  aside .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Pôsteres */
  .posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; }
  .posters.row4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .poster {
    display: block; width: 100%; aspect-ratio: 2 / 3; position: relative; overflow: hidden; padding: 0; cursor: pointer;
    background: var(--panel); border: 0; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center; font-family: var(--serif); font-size: 15px; color: var(--soft); }
  .poster::after { content: ""; position: absolute; inset: 0; border-radius: 3px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s; }
  .poster:hover::after, .poster:focus-visible::after { box-shadow: inset 0 0 0 2px var(--text); }
  .poster:focus-visible { outline: none; }
  .pmeta { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 16px; }
  .pmeta .on { color: var(--text); }
  .pmeta .pct { margin-left: auto; }
  .icon { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }

  /* Filtros da aba Jogos */
  .filters { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 18px; }
  .filters .opts { display: flex; flex-wrap: wrap; gap: 18px; }
  .filters button { background: none; border: 0; padding: 0; cursor: pointer; }
  .filters button:hover { color: var(--text); }
  .filters button[aria-pressed="true"] { color: var(--text); }

  /* Diário */
  .diary { width: 100%; border-collapse: collapse; }
  .diary th { text-align: left; padding: 0 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .diary td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .diary th:first-child, .diary td:first-child { padding-left: 0; }
  .diary th:last-child, .diary td:last-child { padding-right: 0; text-align: right; }
  .diary .num { font-variant-numeric: tabular-nums; color: var(--soft); }
  .cal { width: 52px; }
  .cal span {
    display: inline-block; width: 44px; text-align: center; border: 1px solid var(--faint); border-radius: 3px;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); padding: 3px 0; line-height: 1.3;
  }
  .day { font-size: 22px; font-weight: 500; color: var(--soft); width: 44px; font-variant-numeric: tabular-nums; }
  .entry { display: flex; align-items: center; gap: 12px; white-space: normal; }
  .entry .poster { width: 34px; flex: none; }
  .entry .poster .ph { font-size: 9px; padding: 2px; }
  .entry .t { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .entry .p { color: var(--muted); font-size: 12px; }
  .year-row td { border-bottom: 0; padding: 26px 0 8px; font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .diary .year-row td { text-align: left; }
  .year-row:first-child td { padding-top: 0; }
  .year-row td small { font-family: "Work Sans", sans-serif; font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  /* Página do jogo (janela) */
  dialog {
    width: min(760px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--text); overflow: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  .d-back { height: 220px; position: relative; background: var(--panel); }
  .d-back img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-back::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11,11,12,0) 30%, var(--bg) 100%); }
  .d-body { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; padding: 0 24px 24px; margin-top: -70px; position: relative; z-index: 1; }
  .d-body .poster { cursor: default; }
  .d-body .poster:hover::after { box-shadow: none; }
  .d-title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 72px 0 2px; line-height: 1.15; }
  .d-sub { color: var(--muted); margin-bottom: 18px; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .fact { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .fact:nth-child(odd) { padding-right: 12px; }
  .fact .v { font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); cursor: pointer; font-size: 18px; line-height: 1; }

  footer { margin: 48px 0 40px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; }

  @media (max-width: 760px) {
    .backdrop { height: 220px; }
    .profile { margin-top: -44px; }
    .avatar { width: 60px; height: 60px; font-size: 26px; }
    .counters { width: 100%; justify-content: space-between; }
    .counter { padding: 0 8px; flex: 1; }
    .counter b { font-size: 18px; }
    .counter .label { font-size: 10px; letter-spacing: .06em; }
    .backdrop .caption { display: none; }
    nav.sections { gap: 24px; }
    .profile-grid { grid-template-columns: minmax(0, 1fr); }
    .posters { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .posters.row4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .posters.row4 > :nth-child(n+4) { display: none; }
    .diary .opt { display: none; }
    .d-body { grid-template-columns: 96px minmax(0, 1fr); gap: 16px; padding: 0 16px 20px; margin-top: -48px; }
    .d-title { font-size: 21px; margin-top: 52px; }
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="wrap">
  <header class="profile">
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div>
        <h1 id="user"></h1>
        <div class="sub" id="updated"></div>
      </div>
    </div>
    <div class="counters" id="counters"></div>
  </header>

  <nav class="sections" id="nav"></nav>

  <main id="view"></main>

  <footer>Dados da API de troféus da PSN. Zerado = troféu de fim de história. Início = primeiro troféu.</footer>
</div>

<dialog id="game"></dialog>

<script>
/*
 * ============================================================
 *  DADOS DOS JOGOS — edite aqui para adicionar/atualizar jogos
 * ============================================================
 *  platform:     "PS5", "PS4", ...
 *  startedAt:    data do primeiro troféu (AAAA-MM-DD)
 *  finishedAt:   data do troféu que indica que o jogo foi zerado (AAAA-MM-DD); null = não zerado
 *  finishTrophy: nome do troféu usado para determinar que zerou
 *  platinumAt:   data do troféu de platina (AAAA-MM-DD); null = sem platina
 *  lastPlayedAt: último acesso ao jogo (AAAA-MM-DD)
 *  trophies:     { earned, total, progress (%) }
 *  hours:        horas jogadas (aceita decimal, ex.: 9.15 = 9h09)
 *  genres:       gêneros, como vêm da PSN (opcional)
 *  cover:        URL da capa quadrada, ou lista de URLs tentadas em ordem (vira pôster recortado)
 *  backdrop:     URL da arte larga do jogo (opcional)
 *  Imagens salvas dentro do arquivo ficam em ART (no fim do script) e têm prioridade.
 */
const UPDATED_AT = "2026-10-22";
const PSN_USER = "gabcrstn";

const GAMES = [
  {
    title: "Resident Evil 3",
    platform: "PS5",
    startedAt: "2026-03-11",
    finishedAt: "2026-03-15",
    finishTrophy: "Survivor",
    platinumAt: null,
    lastPlayedAt: "2026-05-10",
    trophies: { earned: 21, total: 33, progress: 40 },
    hours: 9.15,
    genres: ["Ação", "Aventura"],
    cover: [
      "https://image.api.playstation.com/vulcan/ap/rnd/202206/0206/WmriZBRlSeXWEEDLJOWW7MdW.png",
      "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/952060/library_600x900.jpg"
    ],
    backdrop: "https://image.api.playstation.com/vulcan/ap/rnd/202206/0307/wIVJREWyBg8SyXvXYuBPG6je.png"
  }
];

/* ============================================================ */

const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const SECTIONS = { perfil: "Perfil", jogos: "Jogos", diario: "Diário" };
const FILTERS = { todos: "Todos", zerados: "Zerados", jogando: "Jogando", platinados: "Platinados" };
const state = { section: "perfil", filter: "todos" };
try {
  const saved = JSON.parse(localStorage.getItem("gameslog-ui") || "{}");
  if (SECTIONS[saved.section]) state.section = saved.section;
  if (FILTERS[saved.filter]) state.filter = saved.filter;
} catch (e) {}
const save = () => { try { localStorage.setItem("gameslog-ui", JSON.stringify(state)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isDone = (g) => !!g.finishedAt;
const isPlat = (g) => !!g.platinumAt;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d} ${MONTHS[m - 1]} ${y}`;
}
function fmtHours(h) {
  const total = Math.round(h * 60);
  return `${Math.floor(total / 60)}h${String(total % 60).padStart(2, "0")}`;
}
function daysBetween(a, b) {
  return a && b ? Math.round((new Date(b) - new Date(a)) / 86400000) : null;
}
// Troca para a próxima imagem da lista quando uma não carrega; sem mais opções, fica o nome do jogo.
function nextImg(img) {
  const [next, ...rest] = JSON.parse(img.dataset.next || "[]");
  if (!next) return img.remove();
  img.dataset.next = JSON.stringify(rest);
  img.src = next;
}
function imgTag(sources, alt = "") {
  const list = sources.filter(Boolean);
  if (!list.length) return "";
  return `<img src="${esc(list[0])}" data-next="${esc(JSON.stringify(list.slice(1)))}" alt="${esc(alt)}" loading="lazy" onerror="nextImg(this)">`;
}
const posterSources = (g) => [ART[g.title]?.poster, ...[].concat(g.cover || [])];
const backdropSources = (g) => [ART[g.title]?.backdrop, g.backdrop];

const ICON = {
  done: `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`,
  playing: `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg>`,
  plat: `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2h7v3.5a3.5 3.5 0 0 1-7 0zM4.5 3H2.5v1.2a2.3 2.3 0 0 0 2.2 2.3M11.5 3h2v1.2a2.3 2.3 0 0 1-2.2 2.3M8 9v3M5.5 14h5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`
};

/* ---------- Pôster ---------- */

function poster(g) {
  return `<button class="poster" type="button" data-game="${esc(g.title)}" title="${esc(g.title)}" aria-label="${esc(g.title)}">
    <span class="ph">${esc(g.title)}</span>${imgTag(posterSources(g), `Capa de ${g.title}`)}</button>`;
}
// Linha abaixo do pôster: zerado/jogando, platina e % de troféus.
function posterMeta(g, extra) {
  const status = isDone(g) ? `<span class="on" title="Zerado">${ICON.done}</span>` : `<span title="Jogando">${ICON.playing}</span>`;
  const plat = isPlat(g) ? `<span class="on" title="Platinado">${ICON.plat}</span>` : "";
  const right = extra ?? (g.trophies ? `${g.trophies.progress}%` : "");
  return `<div class="pmeta">${status}${plat}<span class="pct">${right}</span></div>`;
}
function posterGrid(list, opts = {}) {
  return `<div class="posters${opts.row ? " row4" : ""}">${list.map((g) =>
    `<div>${poster(g)}${posterMeta(g, opts.meta ? opts.meta(g) : undefined)}</div>`).join("")}</div>`;
}

/* ---------- Seções ---------- */

const byDesc = (key) => (a, b) => (b[key] || "").localeCompare(a[key] || "") || a.title.localeCompare(b.title);
const shortDate = (iso) => { const [, m, d] = iso.split("-"); return `${d} ${MONTHS[m - 1]}`; };

function sectionHead(title, link) {
  return `<div class="section-head"><span class="label">${title}</span>${link ? `<button type="button" class="label" data-goto="${link[0]}" data-filter="${link[1]}">Ver todos</button>` : ""}</div>`;
}

function viewPerfil() {
  const playing = GAMES.filter((g) => !isDone(g)).sort(byDesc("lastPlayedAt"));
  const done = GAMES.filter(isDone).sort(byDesc("finishedAt"));
  const plats = GAMES.filter(isPlat).sort(byDesc("platinumAt"));
  const years = {};
  for (const g of done) years[g.finishedAt.slice(0, 4)] = (years[g.finishedAt.slice(0, 4)] || 0) + 1;
  const platforms = {};
  for (const g of GAMES) platforms[g.platform] = (platforms[g.platform] || 0) + 1;
  const rows = (obj, unit) => Object.entries(obj).sort((a, b) => b[0].localeCompare(a[0]))
    .map(([k, n]) => `<div class="row"><span>${esc(k)}</span><span>${plural(n, unit[0], unit[1])}</span></div>`).join("");

  return `<div class="profile-grid"><div>
    <section class="section">${sectionHead("Jogando agora", ["jogos", "jogando"])}
      ${playing.length ? posterGrid(playing.slice(0, 4), { row: true }) : `<div class="none">Nenhum jogo em andamento.</div>`}</section>
    <section class="section">${sectionHead("Zerados recentemente", ["diario", ""])}
      ${done.length ? posterGrid(done.slice(0, 4), { row: true, meta: (g) => shortDate(g.finishedAt) }) : `<div class="none">Nenhum jogo zerado ainda.</div>`}</section>
    <section class="section">${sectionHead("Platinas", ["jogos", "platinados"])}
      ${plats.length ? posterGrid(plats.slice(0, 4), { row: true, meta: (g) => shortDate(g.platinumAt) }) : `<div class="none">Nenhuma platina ainda.</div>`}</section>
  </div>
  <aside>
    <section class="section">${sectionHead("Zerados por ano")}${rows(years, ["jogo", "jogos"]) || `<div class="none">—</div>`}</section>
    <section class="section">${sectionHead("Plataformas")}${rows(platforms, ["jogo", "jogos"])}</section>
  </aside></div>`;
}

function viewJogos() {
  const pick = {
    todos: () => true,
    zerados: isDone,
    jogando: (g) => !isDone(g),
    platinados: isPlat
  }[state.filter];
  const list = GAMES.filter(pick).sort(byDesc("lastPlayedAt"));
  const opts = Object.entries(FILTERS).map(([k, l]) =>
    `<button type="button" class="label" data-set-filter="${k}" aria-pressed="${state.filter === k}">${l}</button>`).join("");
  return `<div class="filters"><div class="opts">${opts}</div><span class="label">${plural(list.length, "jogo", "jogos")}</span></div>
    ${list.length ? posterGrid(list) : `<div class="none">Nenhum jogo nesse filtro.</div>`}`;
}

function viewDiario() {
  const done = GAMES.filter(isDone).sort(byDesc("finishedAt"));
  if (!done.length) return `<div class="none">Nenhum jogo zerado ainda.</div>`;
  let year = null, month = null;
  const rows = done.map((g) => {
    const [y, m, d] = g.finishedAt.split("-");
    let out = "";
    if (y !== year) {
      year = y; month = null;
      const n = done.filter((x) => x.finishedAt.startsWith(y)).length;
      out += `<tr class="year-row"><td colspan="9">${y}<small>${plural(n, "jogo zerado", "jogos zerados")}</small></td></tr>`;
    }
    const cal = m !== month ? `<span>${MONTHS[m - 1]}<br>${y}</span>` : "";
    month = m;
    const days = daysBetween(g.startedAt, g.finishedAt);
    return out + `<tr>
      <td class="cal">${cal}</td>
      <td class="day">${Number(d)}</td>
      <td><div class="entry">${poster(g)}<div><div class="t">${esc(g.title)}</div><div class="p">${esc(g.platform)}</div></div></div></td>
      <td class="num opt">${fmtDate(g.startedAt)}</td>
      <td class="num opt">${days != null ? plural(days, "dia", "dias") : "—"}</td>
      <td class="opt">${isPlat(g) ? `<span title="Platinado">${ICON.plat}</span>` : `<span style="color:var(--faint)">—</span>`}</td>
      <td class="num">${g.trophies ? `${g.trophies.progress}%` : "—"}</td>
      <td class="num opt">${g.trophies ? `${g.trophies.earned}/${g.trophies.total}` : "—"}</td>
      <td class="num">${g.hours != null ? fmtHours(g.hours) : "—"}</td>
    </tr>`;
  }).join("");
  return `<table class="diary"><thead><tr>
      <th class="label">Mês</th><th class="label">Dia</th><th class="label">Jogo</th>
      <th class="label opt">Início</th><th class="label opt">Levou</th><th class="label opt">Platina</th>
      <th class="label">%</th><th class="label opt">Troféus</th><th class="label">Horas</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- Página do jogo ---------- */

function openGame(title) {
  const g = GAMES.find((x) => x.title === title);
  if (!g) return;
  const back = imgTag(backdropSources(g));
  const fact = (k, v) => `<div class="fact"><div class="label">${k}</div><div class="v">${v}</div></div>`;
  const days = daysBetween(g.startedAt, g.finishedAt);
  $("game").innerHTML = `
    <button class="close" type="button" aria-label="Fechar">×</button>
    <div class="d-back">${back}</div>
    <div class="d-body">
      <div>${poster(g)}</div>
      <div>
        <h2 class="d-title">${esc(g.title)}</h2>
        <div class="d-sub">${esc([g.platform, ...(g.genres || [])].filter(Boolean).join(" · "))}</div>
        <div class="facts">
          ${fact("Status", isDone(g) ? `${ICON.done} Zerado` : `${ICON.playing} Jogando`)}
          ${fact("Platina", isPlat(g) ? `${ICON.plat} ${fmtDate(g.platinumAt)}` : "Não")}
          ${fact("Início", fmtDate(g.startedAt))}
          ${fact("Zerado em", fmtDate(g.finishedAt) + (days != null ? ` <span style="color:var(--muted)">· ${plural(days, "dia", "dias")}</span>` : ""))}
          ${fact("Troféus", g.trophies ? `${g.trophies.progress}% <span style="color:var(--muted)">· ${g.trophies.earned}/${g.trophies.total}</span>` : "—")}
          ${fact("Horas", g.hours != null ? fmtHours(g.hours) : "—")}
          ${fact("Troféu final", esc(g.finishTrophy || "—"))}
          ${fact("Último acesso", fmtDate(g.lastPlayedAt))}
        </div>
      </div>
    </div>`;
  $("game").showModal();
}
$("game").addEventListener("click", (e) => {
  if (e.target === $("game") || e.target.closest(".close")) $("game").close();
});

/* ---------- Montagem ---------- */

function renderHeader() {
  // Fundo: arte do jogo com atividade mais recente que tenha imagem larga.
  const hero = GAMES.filter((g) => backdropSources(g).some(Boolean))
    .sort((a, b) => (b.lastPlayedAt || b.finishedAt || "").localeCompare(a.lastPlayedAt || a.finishedAt || ""))[0];
  $("backdrop").innerHTML = hero ? imgTag(backdropSources(hero)) + `<span class="caption">${esc(hero.title)}</span>` : "";

  $("avatar").textContent = PSN_USER[0].toUpperCase();
  $("user").textContent = PSN_USER;
  $("updated").textContent = `PSN · atualizado em ${fmtDate(UPDATED_AT)}`;
  const year = String(new Date().getFullYear());
  const counters = [
    ["Jogos", GAMES.length],
    ["Zerados", GAMES.filter(isDone).length],
    [`Em ${year}`, GAMES.filter((g) => g.finishedAt && g.finishedAt.startsWith(year)).length],
    ["Platinas", GAMES.filter(isPlat).length],
    ["Horas", fmtHours(GAMES.reduce((s, g) => s + (g.hours || 0), 0))]
  ];
  $("counters").innerHTML = counters.map(([l, v]) => `<div class="counter"><b>${v}</b><span class="label">${l}</span></div>`).join("");
}

function renderNav() {
  $("nav").innerHTML = Object.entries(SECTIONS).map(([k, l]) =>
    `<button type="button" data-goto="${k}" aria-current="${state.section === k}">${l}</button>`).join("");
}

function renderView() {
  $("view").innerHTML = { perfil: viewPerfil, jogos: viewJogos, diario: viewDiario }[state.section]();
}

function render() {
  renderNav();
  renderView();
}

// Um único ouvinte para navegação, filtros e pôsteres.
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-goto]");
  if (go) {
    state.section = go.dataset.goto;
    if (go.dataset.filter) state.filter = go.dataset.filter;
    save(); render();
    return;
  }
  const f = e.target.closest("[data-set-filter]");
  if (f) { state.filter = f.dataset.setFilter; save(); renderView(); return; }
  const p = e.target.closest("[data-game]");
  if (p && !p.closest("dialog")) openGame(p.dataset.game);
});
